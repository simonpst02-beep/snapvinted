services:
  spyebay-api:
    build:
      context: ./backend

    container_name: spyebay-api

    restart: unless-stopped

    env_file:
      - .env.database

    ports:
      - "100.81.68.109:8103:8103"

    networks:
      - projets-net

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8103/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  projets-net:
    external: true
