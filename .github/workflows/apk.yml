# Compile l'APK à chaque envoi. Quand le fichier VERSION contient un numéro
# qui n'a pas encore été publié, l'APK est publié dans les « Releases ».
name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Préparer le fichier
        id: v
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          cp app/build/outputs/apk/release/app-release.apk SnapVinted.apk
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: SnapVinted-apk
          path: SnapVinted.apk
      - name: Publier la version si elle est nouvelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "La version $V existe déjà : pas de nouvelle publication."
          else
            gh release create "$V" SnapVinted.apk --target "${GITHUB_SHA}" --title "SnapVinted $V" --generate-notes
          fi
